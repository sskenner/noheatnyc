name: Build and deploy

on:
  schedule:
    - cron: "15 11 * * *"   # daily, ~7 AM New York, after 311 data refreshes overnight
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post the Bluesky roundup now (skips the Monday/Thursday check)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from NYC Open Data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digest.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bluesky posts. Runs after deploy so the linked pages are live; post_bsky.py
  # decides whether to post (Mon/Thu for the roundup, cold forecasts for alerts).
  post:
    needs: deploy
    if: github.event_name == 'schedule' || inputs.post_now
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: digest
          path: data
      - name: Roundup (Mondays and Thursdays)
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python post_bsky.py weekly ${{ inputs.post_now && '--force' || '' }}
      - name: Cold-night alert (when the forecast low is 40°F or below)
        if: success() || failure()
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python post_bsky.py cold
