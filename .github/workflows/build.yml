name: Build and deploy

on:
  schedule:
    - cron: "15 11 * * *"   # daily, ~7 AM New York, after 311 data refreshes overnight
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post the weekly Bluesky roundup now (skips the Monday check)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the live site's complaint counts (baseline for email alerts)
        run: python email_alerts.py --save-previous
      - name: Build site from NYC Open Data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-data
          path: |
            data/digest.json
            data/previous_counts.json
            dist/counts.json
            dist/search.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Weekly Bluesky roundup. Runs after deploy so the linked pages are live;
  # post_bsky.py itself only posts on Mondays in heat season, once a week.
  post:
    needs: deploy
    if: github.event_name == 'schedule' || inputs.post_now
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: build-data
      - name: Post to Bluesky
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python post_bsky.py ${{ inputs.post_now && '--force' || '' }}

  # Building alert emails. Runs after every deploy (not just the daily one), because
  # each deploy moves the live counts.json that the next run diffs against.
  alerts:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: build-data
      - name: Email building alerts
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python email_alerts.py
