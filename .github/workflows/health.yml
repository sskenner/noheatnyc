name: Daily health check

# Checks the live site after the morning build: up, today's data, pages, affiliate links,
# HTTPS. A failed run emails you (GitHub → Settings → Notifications → Actions).
on:
  schedule:
    - cron: "45 13 * * *"   # ~9:45 AM New York, 2.5 h after the build starts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check noheatnyc.com
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python health_check.py
